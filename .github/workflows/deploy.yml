# Deploys to Fly.io after the publish workflow succeeds on main (or by hand).
# Switched on by two repository settings (Settings -> Secrets and variables -> Actions):
#   variable FLY_APP        the Fly app name (from `fly launch`)
#   secret   FLY_API_TOKEN  from `fly tokens create deploy -x 999999h`
# Google sign-in secrets are set on the app itself with `fly secrets set` (see README).
name: deploy
on:
  workflow_run:
    workflows: [publish]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  fly:
    if: ${{ vars.FLY_APP != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only --app "$FLY_APP"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ vars.FLY_APP }}
