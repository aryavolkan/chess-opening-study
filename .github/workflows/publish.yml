name: publish
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name candidate -p 3000:3000 "$IMAGE:candidate"
          ok=
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/api/health; then echo; ok=1; break; fi
            sleep 2
          done
          curl -fsS -o /dev/null -w 'index: HTTP %{http_code}\n' http://127.0.0.1:3000/ || ok=
          curl -fsS -o /dev/null -w 'engine wasm: HTTP %{http_code}\n' http://127.0.0.1:3000/vendor/stockfish/stockfish-19-lite-single.wasm || ok=
          docker logs candidate
          docker rm -f candidate
          [ "$ok" = 1 ]
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
