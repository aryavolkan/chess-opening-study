# Fly.io deployment. One machine, one volume, engine kept running:
#   fly launch --copy-config --no-deploy
#   fly volumes create study_data --size 1
#   fly secrets set GOOGLE_CLIENT_ID=... GOOGLE_CLIENT_SECRET=... ADMIN_EMAILS=you@example.com
#   fly deploy
# BASE_URL below must be the public origin Google redirects back to: change it
# if the app name or the domain changes.
app = "chess-opening-study"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "3000"
  DB_PATH = "/data/study.sqlite"
  BASE_URL = "https://chess-opening-study.fly.dev"

[[mounts]]
  source = "study_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "90s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
